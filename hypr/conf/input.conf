input {
    kb_layout = us

    follow_mouse = 1
    sensitivity = 0.5
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        disable_while_typing = false
        scroll_factor = 0.7
    }
}

device {
    name = epic-mouse-v1
    sensitivity = 4
}

gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
