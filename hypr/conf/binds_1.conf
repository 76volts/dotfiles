# --- apps ---
bind = SUPER, Q, exec, kitty
bind = SUPER, B, exec, firefox-esr
bind = SUPER, T, exec, thunar
bind = SUPER, E, exec, kitty --class yazi -e yazi
bind = SUPER, D, exec, omniglyph

# --- system ---
bind = SUPER, C, killactive
bind = SUPER, F, togglefloating
bind = SUPER, J, layoutmsg, togglesplit

# --- DMS ---
bind = SUPER, N, exec, dunstctl history-pop
bind = SUPER, V, exec, kitty --class popup -e clipse
bind = ALT, space, exec, fuzzel
bind = SUPER, L, exec, swaylock
bind = SUPER, X, exec, syspower -p 4

# --- screenshots ---
bind = , Print, exec, hyprshot -m output -o ~/Pictures/screenshot
bind = SUPER, Print, exec, hyprshot -m window -o ~/Pictures/screenshot
bind = SUPER SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/screenshot
bind = SUPER SHIFT, T, exec, normcap

# --- navigation ---
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# --- workspaces ---
bind = SUPER, Tab, workspace, m+1
bind = SUPER SHIFT, Tab, workspace, m-1

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# --- special workspace ---
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# --- mouse ---
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}' > ~/.local/state/wobpipe
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}' > ~/.local/state/wobpipe

bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# --- brightness ---
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5% && brightnessctl -m | cut -d, -f4 | tr -d '%' > ~/.local/state/wobpipe
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && brightnessctl -m | cut -d, -f4 | tr -d '%' > ~/.local/state/wobpipe
