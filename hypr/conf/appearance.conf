general {
    gaps_in = 2
    gaps_out = 5
    border_size = 1

    col.active_border = rgba(3DCDF7ee) rgba(3D3F52ee) 45deg
    col.inactive_border = rgba(7D7F8544)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
#        range = 2
#        render_power = 2
#        color = rgba(1E1E2Eaa)
    }

    blur {
        enabled = false
#        size = 3            # slightly better blur
#        passes = 2          # smoother popups (important for DMS)
#        vibrancy = 0.1      # subtle glass effect
#        new_optimizations = true
    }
}

animations {
    enabled = yes

    bezier = smooth, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 2, smooth
    animation = windowsIn, 1, 2, smooth, popin 80%
    animation = windowsOut, 1, 2, default, popin 80%

    animation = fade, 1, 2, default
    animation = border, 1, 2, default
    animation = workspaces, 1, 2, default
}

#dwindle {
#    pseudotile = true
#    preserve_split = true
#}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    focus_on_activate = true
    disable_hyprland_logo = true   # cleaner startup
    disable_splash_rendering = true
}

xwayland {
    force_zero_scaling = true
}
